# agenda configuration — copy to $XDG_CONFIG_HOME/agenda/config.yml
# (defaults to ~/.config/agenda/config.yml).
#
# Every field is optional; agenda ships with the defaults shown here. The PRs
# and Sessions views work out of the box (PRs reuses your `gh` auth). Only the
# Linear view needs configuration — a personal API key.

# Which views to show, in tab order. Recognised: prs, sessions, linear.
# A view can also be dropped with its `enabled: false` flag below, without
# reordering this list.
views: [prs, sessions, linear]

# Check GitHub for a newer release at startup and show it in the tab bar.
# Reports only: agenda never replaces its own binary. Set false to skip the
# network call entirely.
update_check: true

# Render lists as swimlanes derived from the active sort: Linear sorted by
# status gets status lanes, date sorts get Today/Yesterday/7d/30d/Older
# buckets, sessions by cwd get cwd lanes, and so on. Sorts with no sensible
# buckets (e.g. sessions by msgs) stay flat. Off by default: flat lists.
# Mark rows that arrived since the last fetch with a dot, cleared when you
# select the row. Catches what a missed notification would have told you.
unread: true

# Show the hotkey bar along the bottom. On by default; with it off only a
# waiting-errors marker and the help key remain, on the right, since those
# are the two you cannot work around by memory.
footer: true

# Keep unread marks and GitHub notifications in step, both ways: reading a
# row here marks its notification read, and a notification read on
# github.com (or any other client) clears the mark here. Review-requested
# PRs only: your own PRs have no notification behind them. Costs one extra
# (paged) notifications request per refresh. Off by default: reading a row
# is a cursor move, and that should not quietly clear your real inbox.
unread_sync: false

grouping: false

# How long a per-item view toggle lasts. "ephemeral" (default) resets it when
# you move to another item, so a diff opened on one PR does not put every
# other PR in diff view; "persist" keeps it until you toggle back.
toggles: ephemeral

# Start with the preview (detail) pane hidden so the list takes the full
# width — friendlier to narrow terminals. The toggle_preview key (default
# "v") shows/hides it at runtime either way. Off by default.
hide_preview: false

theme:
  # Built-in palette: default, catppuccin-mocha, catppuccin-latte, tokyonight,
  # gruvbox, dracula, nord, rose-pine. "default" uses your terminal's ANSI
  # colors.
  name: default
  # Override individual colors on top of the named theme. Values are hex or
  # ANSI color numbers. Keys: accent, border, text, dim, green, red, yellow,
  # blue, cyan, magenta.
  # palette:
  #   accent: "#f5c2e7"
  # Decorative Nerd Font icons (tab and nav-tree icons). The core status
  # glyphs always assume a Nerd Font (as upstream does); this drops the
  # extras for plain-font setups.
  glyphs: true

# Background auto-refresh. `every` is the global default; the per-view keys
# override it ("0" disables refresh for just that view). Off when absent.
refresh:
  every: "0"     # e.g. "5m"
  # prs: 2m
  # linear: 10m
  # sessions: "0"

# Notify when something new appears: a PR waiting on your review, or a Linear
# issue newly assigned to you. The popup channel is "off" (default),
# "terminal" (an in-app toast, top right), or "desktop" (an OS
# notification). Sound defaults on once the popup is on. Audition both via
# ctrl+s -> "send test notification".
notifications:
  popup: off
  # What clicking a desktop notification does: "url" opens the PR or issue
  # (default), "none" nothing. macOS needs terminal-notifier for this, and
  # for a proper app icon; without it notifications still post through
  # osascript, just plainer and not clickable.
  # click: url
  # sound: true

# Keybind overrides: scope -> action -> key(s). A binding may be a single key
# or a list; an empty list disables the action. Defaults shown commented.
# Easier: ctrl+s -> "edit keybinds" edits these in-app with collision
# detection and writes them back here.
# keys:
#   global:
#     next_view: [tab, L]
#     prev_view: [shift+tab, H]
#     refresh: ctrl+r
#     quit: [q, ctrl+c]
#     help: "?"
#     follow: l
#     filter: f
#     zoom: z
#     config: ctrl+s
#     preview_up: shift+up
#     preview_down: shift+down
#     preview_pgup: pgup
#     preview_pgdn: pgdown
#   list:
#     up: [up, k]
#     down: [down, j]
#     top: [g, home]
#     bottom: [G, end]
#     half_up: ctrl+u
#     half_down: ctrl+d
#     quick_filter: /
#     clear_filter: esc
#   prs:
#     open: enter
#     copy_url: y
#     diff: d
#     comments: c
#     review: r
#     comment: C          # new top-level PR comment
#     reply: R            # reply to the inline thread under the cursor
#     resolve: X          # resolve/unresolve that thread
#     next_thread: "]"   # also jumps between failed jobs in the jobs pane
#     prev_thread: "["
#     jobs: t             # jobs pane: the PR's CI jobs, grouped by workflow;
#                         # it moves with the list keys below while focused
#     open_job: o         # open the job under the cursor in the browser
#     job_log: p          # page its log through less (GitHub Actions)
#     rerun: x            # rerun popup: failed jobs, this job, or the workflow
#     sort: s
#     reverse: S
#     toggle_review: w
#   sessions:
#     resume: enter
#     sort: s
#     reverse: S
#     agents: a
#     delete: d
#     expand: E
#   linear:
#     nav: ctrl+p
#     mine: m             # only-mine toggle, project sources
#     comments: c         # comments in the preview
#     open: enter
#     copy_url: y
#     copy_branch: b
#     sort: s
#     reverse: S

github:
  # enabled: true
  # Search query for your own PRs, in GitHub search syntax. `is:pr` is added
  # automatically.
  filter: "author:@me is:open archived:false"
  # Search query for the "needs your review" section (toggle it with 'w').
  review_filter: "review-requested:@me is:open archived:false"
  # Show that section on startup. Off by default: the view opens with just
  # your own PRs, as it always did.
  show_review_requested: false
  # In the review-requested section, dim PRs you have already reviewed and
  # tag them "reviewed" so the eye can skip them. Off by default.
  mark_reviewed: false
  # Both filters take GitHub search syntax and are the starting point for
  # every fetch; the in-app filter ('/') narrows what they returned, and
  # takes qualified terms too (-label:deps, is:draft, review:approved,
  # checks:failing) matched locally against the loaded rows.
  # The sort the PR list opens on: date, review, checks, repo, size or
  # author. Omit (or leave empty) for the view's default, date. 's' still
  # cycles sorts at runtime; this is only the starting point.
  sort: ""
  # Start with that sort reversed, as if you had pressed 'S'.
  reverse: false
  # Drop approved, still-open PRs from the review-requested list: the ball
  # is with the author. Off by default, so you can still open one you want
  # to comment on. An approval by anyone counts, not just yours: someone
  # else approving is no reason for you to stop looking. Merged PRs are
  # handled by review_filter's is:open, not by this.
  hide_approved: false
  # Re-read the selected PR once the cursor stops moving, so check state and
  # review decisions are current on the row you are about to act on rather
  # than as of the last full refresh. On by default: one request for a single
  # PR, debounced, so cycling a list costs nothing until you stop.
  refresh_row: true
  # In the file list, open the file under the cursor and close the one you
  # left, so walking the list reads like scrolling a diff without the pane
  # growing to the length of one. On by default; off keeps a file open
  # until you collapse it with '-'.
  file_auto_expand: true
  # Add merge entries to the review popup ('r'): 'm' merges, 'M' enables
  # auto-merge so a PR lands once its checks pass. Off by default, because
  # merging is the one thing in that popup you cannot undo with another
  # keypress. It always asks before merging, and refuses outright for a
  # draft, a conflict, or while GitHub is still checking mergeability.
  merge: false
  # How 'm' merges: squash (default), merge, or rebase. A repo that forbids
  # the method you pick says so when the merge runs.
  merge_method: squash
  # Delete the head branch after a successful merge, for repos that do not
  # do it themselves. Off by default.
  merge_delete_branch: false
  # Render diffs in the right pane on 'd'. Off by default: 'd' pages the
  # diff through less, the original behavior. The comments pane ('c') and
  # inline-thread annotations need this on to show threads in the diff.
  diff_pane: false
  # Fetch PRs a page at a time, loading the next page when you scroll to the
  # end of the list. On by default: one request for 100 PRs measured 8-10s
  # against a large review-requested search and timed out often enough to
  # matter, where a page of 20 is 3-4s. Set false to fetch everything up front.
  # lazy_paging: true
  # How many PRs one request asks for (default 20, max 100). Bigger pages mean
  # fewer requests and a slower first paint.
  # page_size: 20
  # Truncate the PR description in the preview to this many lines, with 'e'
  # expanding it. 0 never truncates.
  # summary_lines: 10

linear:
  # enabled: true
  # Personal API key. Create one at:
  #   linear.app -> Settings -> Security & access -> API keys
  # Without it, the Linear view shows a setup hint instead of issues.
  token: ""
  # The sort the issue list opens on: date, status, project or priority.
  # Omit for the view's default, date.
  sort: ""
  reverse: false
  # Which issues to fetch (server-side). The default is your assigned issues
  # that aren't completed or canceled, the same as Linear's "assigned" view.
  filter:
    # Which nav source to start on: "assigned" (My Issues, default) or
    # "all" (All Issues). In-app the source is picked in the nav tree
    # (ctrl+p); inside a project source, 'm' toggles only-mine.
    scope: assigned
    include_completed: false
    include_canceled: false
    # teams: [SRE]              # limit to these team keys
    # projects: [Some Project]  # limit to these project names
    # states: [In Progress]     # limit to these workflow states
    # limit: 100
  # Show the navigation tree (Inbox / My Issues / All Issues / pinned
  # projects) on startup. ctrl+p toggles it in-app either way; left/right
  # move between the tree and the list.
  nav: false
  # Render issue comments in the preview on startup ('c' toggles in-app).
  show_comments: false

sessions:
  # Set to false to hide the agent-sessions view.
  enabled: true
  # The sort the session list opens on: recent, cwd, tool, msgs or cost.
  # Omit for the view's default, recent.
  sort: ""
  reverse: false
