# Automatic review of every pull request. It opens an inline thread per
# finding; with "require conversation resolution" on main, those threads
# are what gate the merge, so no human approval is required. A human
# review is still welcome, just not mandatory. Skip it with the
# skip-review label.
#
# The reviewer only reads the PR and posts comments: no build or test
# tools, so PR code never runs with the API key in reach, and a PR that
# tries to talk the reviewer into something can at most post a comment.
# The prompt is read from the base branch, so a PR cannot rewrite the
# rules it is reviewed against.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review') &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      - name: Read review prompt from the base branch
        id: review-prompt
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          # The PR's own copy only when the base has none yet (the PR that
          # introduces the prompt); otherwise a PR could rewrite its rules.
          prompt=$(git show "FETCH_HEAD:.claude/commands/review.md" 2>/dev/null || cat .claude/commands/review.md)
          delim="prompt-$(openssl rand -hex 16)"
          {
            echo "content<<$delim"
            printf '%s\n' "$prompt"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@f1bd27ca5b54584506e40e17884d90bdaaa1a9b3 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ steps.review-prompt.outputs.content }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
