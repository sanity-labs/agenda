name: release-drafter

# PRs are labeled by labeler.yml, which runs the autolabeler after the path
# labeler; this workflow only drafts the release notes from those labels.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
