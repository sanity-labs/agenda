name: labeler

on:
  # pull_request_target so fork PRs get labeled too; the job runs only the
  # pinned action against the base branch's config, never PR code.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  # Path labels and the title's type label, in one job and in that order.
  # The labeler writes back the label set it read when it started plus its
  # own matches, so as two parallel jobs the pair raced: a type label the
  # autolabeler added a second earlier was overwritten (#40 lost "feature"
  # that way). Steps in a job run in sequence, so the type label lands last.
  label:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
      # v7 moved the autolabeler into its own action; its rules (the
      # conventional-commit prefix on the title) live under autolabeler: in
      # release-drafter.yml. It runs even if the path labeler failed: the
      # type label is the one the version bump and changelog depend on.
      - uses: release-drafter/release-drafter/autolabeler@v7
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
