# Maintains a draft release that absorbs every merged PR; publishing the
# draft creates the vX.Y.Z tag, which triggers .github/workflows/release.yml.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# Categories are evaluated in order and every one of them is exclusive, so a
# PR lands in exactly the first that matches. Without that, a PR carrying two
# type labels (#29 had both dependencies and docs) is listed once per
# category. Area labels from .github/labeler.yml (tui, prs-view, ...) are for
# triage and deliberately match nothing here.
categories:
  - title: Features
    exclusive: true
    semver-increment: minor
    when:
      label: feature
  - title: Fixes
    exclusive: true
    when:
      labels: [fix, perf]
  - title: Dependencies
    exclusive: true
    when:
      label: dependencies
  - title: Other
    exclusive: true
    when:
      labels: [chore, docs, ci]

  # Version: a breaking change is major, a feature minor (declared above),
  # anything else patch.
  - type: version-resolver
    semver-increment: major
    when:
      label: breaking
  - type: version-resolver
    semver-increment: patch

# Label PRs from their conventional-commit titles so categories and the
# version bump need no manual labelling.
autolabeler:
  - label: feature
    title: ['/^feat(\(|!|:)/i']
  - label: fix
    title: ['/^fix(\(|!|:)/i']
  - label: perf
    title: ['/^perf(\(|!|:)/i']
  - label: docs
    title: ['/^docs(\(|!|:)/i']
  - label: ci
    title: ['/^ci(\(|!|:)/i']
  - label: chore
    title: ['/^(chore|refactor|test|build)(\(|!|:)/i']

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
template: |
  ## What changed

  $CHANGES
